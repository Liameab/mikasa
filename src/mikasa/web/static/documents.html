<!DOCTYPE html>
<!-- ============================================================================
     Mikasa —— 知识库页（语料库树形管理，v3）
     布局：左侧文件夹树（文件夹可嵌套、文档行可拖拽归夹/改名/删除，顶部
     查找框实时过滤）+ 右侧上传区、在线找论文面板与选中文档详情。
     上传 md/txt/pdf/docx（拖拽或选择）→ 入库分块嵌入 → 出现在树根级，
     拖入文件夹即可归档。
     JS 入口：/static/js/documents.js（树模块：/static/js/kb-tree.js，
     论文面板：/static/js/papers.js）
     ============================================================================ -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>知识库 · Mikasa</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="icon" href="data:,">
</head>
<body>

  <header class="topbar">
    <a class="brand" href="/">Mikasa<small>RAG 问答</small></a>
    <nav class="main">
      <a href="/" data-page="qa">问答</a>
      <a href="/documents" data-page="documents">知识库</a>
      <a href="/eval" data-page="eval">评测</a>
    </nav>
    <div class="health-pill"><span class="muted small">正在连接服务…</span></div>
  </header>

  <!-- 布局类沿用问答页（.qa-layout / .session-pane / .session-list 与树的
       全部行类）：样式在 style.css 里是组件级通用类，直接复用不复制 -->
  <main class="qa-layout">

    <!-- 左侧：语料文件夹树（文件夹/文档行管理交互见 js/kb-tree.js） -->
    <aside class="card session-pane">
      <h2>语料库</h2>
      <input id="kb-search" class="kb-search" type="search"
             placeholder="查找文档 / 文件夹…" autocomplete="off" aria-label="查找">
      <div class="side-actions">
        <button id="new-kb-folder" class="btn ghost grow" type="button"
                title="新建文件夹（可嵌套）">＋ 新建文件夹</button>
      </div>
      <div id="kb-tree" class="session-list"></div>
    </aside>

    <!-- 右侧：未选中文档=上传+引导；选中=阅读区（2026-09-10 起右栏直接读
         正文，不再弹浮层——用户实测反馈"详情卡只有几个字、太丑"） -->
    <div class="kb-main">

      <!-- 上传区（未选中时） -->
      <section class="card" id="intro-card">
        <h2>上传资料（入库后即可被问答检索）</h2>
        <div id="dropzone" class="dropzone" tabindex="0">
          <strong>点击选择或拖入文件</strong>
          <div class="limit">支持 Markdown（.md/.markdown）、纯文本（.txt）、PDF（.pdf）、Word（.docx）；单文件 ≤ 500 MB；重复内容自动跳过；新上传的文件出现在左侧树根级，拖进文件夹即可归档</div>
          <input id="file-input" type="file" hidden accept=".md,.markdown,.txt,.pdf,.docx">
        </div>
        <div id="upload-note" class="muted small" style="margin-top:8px"></div>
      </section>

      <!-- 在线找论文（M7）：检索 arXiv/OpenAlex → 导入开放获取 PDF → 立刻可提问。
           逻辑在 js/papers.js；结果行类样式见 style.css「在线找论文」段 -->
      <section class="card" id="papers-card">
        <h2>在线找论文 <span class="muted small">arXiv + OpenAlex，导入后立刻可提问</span></h2>
        <form id="paper-form" class="paper-form" autocomplete="off">
          <input id="paper-q" class="kb-search" type="search"
                 placeholder="检索论文：中英文关键词均可，如「大语言模型 检索增强」"
                 aria-label="论文检索词">
          <button id="paper-search-btn" class="btn primary" type="submit">搜索</button>
        </form>
        <div class="paper-bar">
          <span id="paper-sources" class="s-chips">
            <button class="s-chip on" type="button" data-source="all">全部来源</button>
            <button class="s-chip" type="button" data-source="arxiv">arXiv</button>
            <button class="s-chip" type="button" data-source="openalex">OpenAlex</button>
          </span>
          <button id="paper-key-toggle" class="btn ghost" type="button"
                  title="OpenAlex 密钥（可选）：填了额度更稳，不填也能用">密钥</button>
        </div>
        <div id="paper-key-row" class="paper-key-row hidden">
          <input id="paper-key-input" class="kb-search" type="password"
                 autocomplete="off" aria-label="OpenAlex 密钥">
          <button id="paper-key-save" class="btn" type="button">保存</button>
          <div id="paper-key-note" class="muted small"></div>
        </div>
        <div id="paper-status" class="muted small"></div>
        <div id="paper-results" class="paper-results"></div>
        <div id="paper-more-row">
          <button id="paper-more" class="btn ghost hidden" type="button">加载更多</button>
        </div>
      </section>

      <!-- 语料总览（未选中时）：计数 + 空态引导 -->
      <section class="card grow" id="list-card">
        <h2>语料文档 <span id="doc-count" class="pill">0 篇</span></h2>
        <div id="doc-detail"></div>
      </section>

      <!-- 阅读区（选中时）：reader.js 内嵌渲染，元数据在底部状态栏 -->
      <section class="card grow hidden" id="reading-card">
        <div id="reader-host"></div>
      </section>

    </div>

  </main>

  <div id="toast"></div>
  <script type="module" src="/static/js/documents.js"></script>
</body>
</html>
