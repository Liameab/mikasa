# ============================================================
# local profile —— 纯本地推理（免费、断网可用）
#   需要：Ollama（https://ollama.com）+ 模型：
#     ollama pull qwen3:8b
#   以及本地嵌入模型（首次运行自动从 HF 下载 bge-small-zh-v1.5，
#   下载需联网一次；之后全离线）。安装依赖：
#     pip install -e ".[local]"
#   4060 8G 可流畅运行 qwen3:8b；若想更快可换 qwen3:4b（改 model 字段）
# ============================================================

profile: local

chunking:
  size: 400
  overlap: 50
  title_prefix: true

retrieval:
  bm25_top_k: 20
  dense_top_k: 20
  dense_enabled: true
  # 融合窗口 14（2026-09-11 由 10 放宽，用户反馈"给的内容太少、漏细节"）。
  # 本地档没有重排器，融合窗口就是最终注入数——放宽的直接收益是模型看到的
  # 素材更多。前提是 Ollama 的上下文窗口够：见下方 llm.num_ctx（2026-09-20 起
  # 由请求本身携带，不再依赖启动器的 OLLAMA_CONTEXT_LENGTH 环境变量）。
  # 历史口径：api 档 63 题实拍 @8 漏 hard 综合题第二金块，@10 时 recall@10=1.000。
  fusion_top_k: 14
  fusion_k: 60
  crosslingual: true  # 中文问英文库：查询自动翻译作第二路（2026-09-10）

reranker:
  # 本地重排**现在开不了**：fastembed ≥0.8 已移除全部重排 API，而本项目锁的
  # 就是 0.8.x——`backend: local` 会直接报 ConfigError。要开得先做版本选型
  # （回落 0.7.x 或换独立重排包），见 ADR-0014 ② 与 known-issues F5。
  # （原注释写的是"改 local 并安装 fastembed 后可用"，与事实相反，2026-09-24 改。）
  backend: none

vision:
  # 图片 → 文本（拍照转笔记）：默认**未接入**——本机没装视觉模型，而识图走
  # 云端意味着把照片发出去，接不接受由你定。三种开法：
  #   ① 设置面板「视觉模型」一键切（推荐，不用改这个文件）；
  #   ② 本机识图：`ollama pull qwen2.5vl:7b`（约 6GB），再把这里改成
  #      backend: local + model: qwen2.5vl:7b（base_url 同上方的 LLM 段）；
  #   ③ 云端识图：backend: api + SiliconFlow（需要 SILICONFLOW_API_KEY，
  #      照片会发到云端）——生成仍走本地，只有识图这一件事出网。
  backend: none

image:
  # 文生图：默认**未接入**——本机没有出图模型，而云端出图意味着提示词要发
  # 出去，接不接受由你定。开法：设置面板「图像生成」选一个来源（推荐，不用
  # 改这个文件）；出图这一件事出网，问答与检索仍全在本机。
  backend: none

llm:
  backend: local
  base_url: ${OLLAMA_BASE_URL:-http://localhost:11434/v1}
  api_key_env: ""
  model: qwen3:8b
  temperature: 0.1
  # 2026-09-09 由 1024 放开；2026-09-20 再放到 4096：用户反馈"本机答得比
  # DeepSeek 少太多"，而 free 提示词现在明确要求分节+表格+写全（呈现规范），
  # 2048（≈3000 字）会把要求落实一半就被截断。上限只封顶不催长。
  # 与 api 档对齐（config/profiles/api.yaml 也是 4096）。
  max_tokens: 4096
  # 思考模式**默认关**（2026-09-20 实测，同一个问题）：
  #   开：14.2s，617 字推理把 400 token 预算吃光，**答案一个字没有**；
  #   关： 1.4s，直接给出答案。本机 8B 上这是最划算的一刀。
  # 需要更深的推理（难题、推导）时，到设置面板「模型」段打开即可。
  think: false
  # 上下文长度**必须显式指定**（2026-09-20 实测，Ollama 0.34.2 + qwen3:8b）：
  # 不带 num_ctx 时运行时默认只吃 2050 个 token 的提示词——而本档"系统提示词
  # + 14 个检索块"轻松上万，等于每次提问都被砍掉大半（还通常从开头丢，连
  # 引用/拒答规则都可能没进模型）。实测同样一段 9000 token 的提示词：
  #   不传 → 处理 2050 ｜ 4096 → 2050 ｜ 8192 → 4098 ｜ **16384 → 8992（完整）**
  # 16384 是显存与效果的分界：4060 8G 上 qwen3:8b 的 KV cache 约占 2.4GB，
  # 再往上（32768 要 4.7GB）会和 5GB 的模型权重抢显存。Mikasa.bat 给源码版设的
  # OLLAMA_CONTEXT_LENGTH=16384 是同一个值，但那只救得了从 bat 启动的 Ollama
  # ——打包版（双击 exe、Ollama 由托盘自启）拿不到，所以这行必须写在配置里。
  num_ctx: 16384

embedding:
  backend: local                # fastembed + onnxruntime（CPU 即可）
  model: BAAI/bge-small-zh-v1.5
  query_prefix: "为这个句子生成表示以用于检索相关文章："
  api_key_env: ""

judge:
  enabled: false                # 本地评测暂不做 judge 指标（成本高、慢），
                                # 检索层指标（recall@k/MRR/nDCG）仍完整可用
  backend: local
  # base_url / api_key_env 必须与 llm 段对齐：JudgeConfig 的 base_url 缺省是
  # None，缺了这行一旦把 enabled 打开，每题都会以 ConfigError 失败
  # （2026-09-11 排查发现，原先只有 api 档配了）
  base_url: ${OLLAMA_BASE_URL:-http://localhost:11434/v1}
  api_key_env: ""
  model: qwen3:8b
  temperature: 0.0
  template_version: "2026-09-01"

web:
  host: 127.0.0.1
  port: 8000

answer:
  bilingual: true  # 命中英文块时回答末尾附"原文+中文翻译"对照（#8，2026-09-10）
