[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mikasa"
version = "0.1.7"
description = "Mikasa — a local-first document RAG workspace with citation tracing and automated evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = [{ name = "Liameab" }]
keywords = ["rag", "llm", "knowledge-base", "retrieval", "chinese", "education"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# ---------------------------------------------------------------------------
# 核心依赖（Windows + CPython 3.13 均已验证存在预编译 wheel，零编译安装）
#
# 版本锁定说明（详见 docs/design-decisions.md 的 ADR 记录）：
#   - openai>=3.3,<4  : 3.0 起更换底层传输层（httpx2），API 层不变；若遇 TLS
#                       问题可退回 openai<3（ADR-0006）
#   - jieba==0.42.1 + setuptools<82 : 2026 年起新版 setuptools 移除
#                       pkg_resources 导致 import jieba 崩溃（jieba#1043），
#                       此为官方认可的临时方案；另有纯 Python bigram 兜底
#   - numpy>=2.1,<3   : fastembed 0.8 要求 numpy>=2.1，勿锁回 1.x
# ---------------------------------------------------------------------------
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.9",  # FastAPI 的 multipart 表单（Web 上传文档用）
    "pydantic>=2.9,<3",
    "pyyaml>=6.0.2",
    "openai>=3.3,<4",
    "numpy>=2.1,<3",
    "pymupdf>=1.24.12",
    "python-docx>=1.1",
    "python-dotenv>=1.0,<2",
    "rich>=13.9",
    "typer>=0.12,<1",
    "jieba==0.42.1",
    "setuptools<82",
]

[project.optional-dependencies]
# 本地推理（Ollama/CPU 嵌入/本地重排）：fastembed 传递依赖 onnxruntime+tokenizers，不显式声明
local = ["fastembed>=0.8,<0.9"]
# 开发与 CI
# httpx<1：starlette TestClient 需要"经典 httpx"传输层；openai 3.x 内置的 httpx2
# 是另一个包、不能替代（两个包名共存无冲突），因此显式声明经典版作为测试依赖
#
# **每条都写上界**（2026-09-11 加）：CI 装的是 `-e ".[dev]"`，没有上界就等于
# 每次跑都拿工具链的最新版，而本地 venv 停在装上那天的版本。ruff 发个新版加条
# 规则、mypy 收紧一条推断，CI 立刻红，本地却怎么都复现不出——"经常蹦出来又找
# 不到原因"的 lint 失败几乎都是这个来源。上界卡在**次版本**（ruff 尤其激进），
# 升级时手动改这里、本地重跑一遍再提交。
dev = [
    "pytest>=8.0,<10",
    "pytest-cov>=5.0,<8",
    "httpx>=0.27,<1",
    "ruff>=0.16,<0.17",
    "mypy>=1.13,<3",
    "pre-commit>=4.0,<6",
]
# 发布构建：本地打包与 .github/workflows/release.yml 装同一套。
# pywebview 只被 packaging/entry.py 用（独立窗口套壳），是打包期依赖而非
# 运行期声明——但 Mikasa.spec 的 hiddenimports 里有它，构建环境必须装上。
packaging = [
    "pyinstaller>=6.22,<7",
    "pywebview>=6.2,<7",
]

[project.urls]
Repository = "https://github.com/<your-github-username>/mikasa"
Documentation = "https://github.com/<your-github-username>/mikasa#readme"
Issues = "https://github.com/<your-github-username>/mikasa/issues"

[project.scripts]
# 入口走 cli.main()：先 setup_logging + 装载仓库根 .env，再派发子命令
mikasa = "mikasa.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mikasa"]

# ---------------------------------------------------------------------------
# Ruff：lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
# **行宽按"显示宽度"算，一个中文字符占两格**（2026-09-11 实测）：含 14 个汉字的
# 一行，Python 的 len() 是 90、ruff 却报 "E501 Line too long (104 > 100)"。
# 本项目注释与界面文案全中文，所以"我数了没超 100"是常见的误判——编辑器给的
# 列号/字符数按字符算，ruff 按宽度算，两者差着汉字个数。报 E501 时先用
# `len()` 之外的方式复核，别直接怀疑配置。
line-length = 100
extend-exclude = ["sample-corpus", "data", "docs", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008（FastAPI 路由默认参数中调用 Depends）属常见误报，在 web 模块按需豁免
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "S101"]  # 测试允许 assert
# 样本生成脚本以长字符串数据为主，行宽按数据排版处理
"tools/build_sample_binaries.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# 仓库根进 sys.path：tests/ 下有用 `from tests.unit.web.conftest import NOTE`
# 这类包路径导入的模块（测试自己写的常量复用）。本地跑时当前目录恰好在
# sys.path 里所以一直没暴露，CI 的全新检出环境会在**收集阶段**直接
# ModuleNotFoundError（2026-09-11 首次上线实测）——显式声明，别靠隐式行为。
pythonpath = ["."]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]
