# CI：双平台（Windows + Ubuntu）跑 lint / 类型检查 / 测试 / CLI 冒烟
# 全程使用 offline profile（MockLLM + 纯 BM25），无需任何 API 密钥、无需网络请求模型服务
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 依赖漏洞扫描只在定时/手动跑（见下面 deps 作业的说明）
  schedule:
    - cron: "23 3 * * 1"  # 每周一 03:23 UTC
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      # 终端按 UTF-8 输出：CI 的英文 Windows 控制台默认 cp1252，中文日志会
      # 变成问号（代码侧已有 errors="replace" 兜底，这里让日志可读）
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # 必须连 [local] 一起装：CI 与开发环境要一致。
      # 只装 [dev] 时 fastembed 缺席，`ignore_missing_imports` 会把整个导入忽略，
      # 于是 reranker.py 里 `# type: ignore[attr-defined]` 变成**多余**，
      # 撞上 `warn_unused_ignores = true` → mypy 报错（2026-09-11 首次 CI 实测）
      - name: Install package (dev + local extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,local]"

      # 诊断：CI 失败时先确认"环境与本地差在哪"（解释器版本、默认编码、
      # 依赖版本）——2026-09-11 首次上线时本地怎么都复现不出 CI 的失败
      - name: Environment info
        run: |
          python -c "import sys, locale; print('python:', sys.version); print('stdout:', sys.stdout.encoding); print('preferred:', locale.getpreferredencoding()); print('filesystem:', sys.getfilesystemencoding())"
          pip list

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy type check
        run: mypy src

      # -x：首个失败即停，日志聚焦；--tb=short：完整断言上下文但去掉长栈
      - name: Pytest (offline, no API keys needed)
        run: pytest -v --cov=mikasa --cov-report=term -x --tb=short

      - name: CLI smoke test (offline profile)
        run: python -m mikasa doctor --profile offline

      # 安装器/启动脚本的语法检查。这两条 .ps1 只有 Windows 上才跑得到，而
      # ruff/mypy/pytest 都不碰它们——2026-09-11 的审查正是在这里放过了几个
      # 数据破坏级缺陷（清盘根、卸载误删）。[Parser]::ParseFile 是零依赖的
      # 语法门：解析不过就红，比"等用户双击才发现"便宜得多。
      - name: PowerShell syntax check (installers)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem packaging -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$null, [ref]$errors)
            if ($errors.Count -gt 0) {
              Write-Host "::error file=$($_.FullName)::$($errors[0].Message)"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
          Write-Host "PowerShell scripts parse cleanly."

      # 发布脚本的静态检查：它们不进 src/，mypy 的 files=["src"] 覆盖不到。
      # 只在 Ubuntu 跑一次即可（与平台无关），Windows 那边省一轮安装时间。
      - name: Release tooling smoke (collect only)
        if: runner.os == 'Linux'
        run: python -c "import ast, pathlib; [ast.parse(p.read_text(encoding='utf-8')) for p in pathlib.Path('tools').glob('*.py')]"

  # 依赖漏洞扫描（2026-09-20 补）。三条取舍写在这里，免得后面有人"顺手"改：
  #   ① **只在定时/手动触发**，不进 push/PR 门禁——上游新报一个 CVE 不该让当天
  #      所有人的 PR 变红；而每周一次的红色是**信号**，该看就看。
  #   ② 扫的是**随包分发的那套依赖**（`pip install -e .`），不是 dev 工具链
  #      （ruff/mypy/pytest 不随 exe/zip 出去，报出来的 CVE 只是噪声）。
  #   ③ 不屏蔽"暂无修复版本"的条目：那些正是要人知道、要人决定怎么办的东西。
  deps:
    name: dependency audit (pip-audit)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install runtime deps + pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install -e .

      - name: pip-audit
        run: pip-audit
